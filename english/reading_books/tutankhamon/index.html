<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutankhamun · Reading</title>
<style>
  :root{
    --bg:#f7f5f0; --surface:#ffffff; --ink:#1d1b18; --ink-soft:#6b655b;
    --line:#e3dfd5; --brand:#2f6f5e; --brand-ink:#ffffff; --chip:#ece8dd;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161513; --surface:#1f1d1a; --ink:#f1eee7; --ink-soft:#a49d90;
      --line:#383530; --brand:#6fb59d; --brand-ink:#0f1f1a; --chip:#2a2723;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161513; --surface:#1f1d1a; --ink:#f1eee7; --ink-soft:#a49d90;
    --line:#383530; --brand:#6fb59d; --brand-ink:#0f1f1a; --chip:#2a2723;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:clamp(24px,6vw,34px);margin:4px 0 4px}
  .sub{color:var(--ink-soft);margin:0 0 18px}
  .tabs{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap}
  .tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
       padding:10px 18px;border-radius:999px;font:inherit;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .hidden{display:none!important}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .chapters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);
        min-width:42px;padding:8px 10px;border-radius:10px;font:inherit;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .ch-title{font-weight:600;margin:0 0 10px}
  audio{width:100%;margin:4px 0 14px}
  .transcript{white-space:pre-wrap;font-size:17px;line-height:1.75;margin:0;max-height:none}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
  .lang button{appearance:none;border:0;background:var(--surface);color:var(--ink);padding:8px 16px;font:inherit;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
  h2{font-size:20px;margin:22px 0 10px}
  .overview{font-size:17px;line-height:1.75}
  .char{padding:10px 0;border-bottom:1px solid var(--line)}
  .char:last-child{border-bottom:0}
  .char b{display:block}
  details{border-bottom:1px solid var(--line);padding:12px 0}
  details:last-child{border-bottom:0}
  summary{cursor:pointer;font-weight:600;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--brand)}
  details[open] summary::before{content:"▾ "}
  details p{margin:8px 0 0}
  .note{color:var(--ink-soft);font-size:14px}
  .err{color:#b3261e}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tutankhamun</h1>
  <p class="sub">Julie Hart · Reading and exam review</p>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabRead" aria-controls="secRead" aria-selected="true">📖 Lectura</button>
    <button class="tab" role="tab" id="tabSum" aria-controls="secSum" aria-selected="false">📝 Resumen</button>
  </nav>

  <!-- SECCIÓN 1: audio + transcripción -->
  <section id="secRead" role="tabpanel" aria-labelledby="tabRead">
    <div class="chapters" id="chapterBtns"></div>
    <div class="card">
      <p class="ch-title" id="readTitle">Chapter 1</p>
      <audio id="player" controls preload="none"></audio>
      <p class="note" id="readErr"></p>
      <pre class="transcript" id="transcript">Loading…</pre>
    </div>
  </section>

  <!-- SECCIÓN 2: resumen con cambio de idioma -->
  <section id="secSum" role="tabpanel" aria-labelledby="tabSum" class="hidden">
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="langEs" aria-pressed="true">Español</button>
      <button id="langEn" aria-pressed="false">English</button>
    </div>
    <div class="card">
      <h2 id="ovTitle" style="margin-top:0">Overview</h2>
      <p class="overview" id="overview"></p>
    </div>
    <div class="card">
      <h2 id="charTitle" style="margin-top:0">Characters</h2>
      <div id="characters"></div>
    </div>
    <div class="card">
      <h2 id="chTitle" style="margin-top:0">Chapters</h2>
      <div id="chapterSummaries"></div>
    </div>
    <p class="note" id="sumErr"></p>
  </section>
</div>

<script>
(function(){
  var BASE = "";
  var CHAPTERS = 12;
  var summary = null;
  var lang = "es";
  var current = 1;

  var UI = {
    es: { ov:"Resumen general", ch:"Personajes", cs:"Capítulos", ready:"Cargando…" },
    en: { ov:"Overview", ch:"Characters", cs:"Chapters", ready:"Loading…" }
  };

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?"0":"")+n; }

  // Preferencia de idioma: se guarda solo para este navegador. Si falla, no pasa nada.
  function getLang(){ try{ return localStorage.getItem("tut_sum_lang") || "es"; }catch(e){ return "es"; } }
  function setLang(v){ try{ localStorage.setItem("tut_sum_lang", v); }catch(e){} }

  // ---- Pestañas ----
  function showTab(which){
    var read = which === "read";
    $("secRead").classList.toggle("hidden", !read);
    $("secSum").classList.toggle("hidden", read);
    $("tabRead").setAttribute("aria-selected", read ? "true" : "false");
    $("tabSum").setAttribute("aria-selected", read ? "false" : "true");
  }
  $("tabRead").onclick = function(){ showTab("read"); };
  $("tabSum").onclick  = function(){ showTab("sum"); };

  // ---- Sección 1: lectura ----
  function buildChapterButtons(){
    var host = $("chapterBtns"); host.innerHTML = "";
    for(var i=1;i<=CHAPTERS;i++){
      (function(n){
        var b = document.createElement("button");
        b.className = "chip"; b.textContent = n;
        b.setAttribute("aria-pressed", n===current ? "true" : "false");
        b.onclick = function(){ loadChapter(n); };
        host.appendChild(b);
      })(i);
    }
  }

  function loadChapter(n){
    current = n;
    var id = pad(n);
    $("readTitle").textContent = "Chapter " + n + (summary && summary.chapters[n-1] ? " · " + summary.chapters[n-1].title.en : "");
    // Audio: Chrome y otros navegadores lo reproducen con sus controles nativos.
    var player = $("player");
    player.src = BASE + "audio/chapter-" + id + ".mp3";
    $("readErr").textContent = "";
    $("transcript").textContent = "Loading…";
    fetch(BASE + "text/chapter-" + id + ".txt")
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function(t){ $("transcript").textContent = t; })
      .catch(function(){
        $("transcript").textContent = "";
        $("readErr").textContent = "No se pudo cargar la transcripción. Abre la página por HTTP (ver README).";
        $("readErr").className = "note err";
      });
    Array.prototype.forEach.call($("chapterBtns").children, function(b, idx){
      b.setAttribute("aria-pressed", idx+1===n ? "true" : "false");
    });
  }

  // ---- Sección 2: resumen ----
  function renderSummary(){
    if(!summary) return;
    var L = lang, U = UI[L];
    $("langEs").setAttribute("aria-pressed", L==="es" ? "true" : "false");
    $("langEn").setAttribute("aria-pressed", L==="en" ? "true" : "false");
    $("ovTitle").textContent = U.ov;
    $("charTitle").textContent = U.ch;
    $("chTitle").textContent = U.cs;
    $("overview").textContent = summary.overview[L];

    var chars = $("characters"); chars.innerHTML = "";
    summary.characters.forEach(function(c){
      var d = document.createElement("div"); d.className = "char";
      var b = document.createElement("b"); b.textContent = c.name;
      var p = document.createElement("span"); p.textContent = c[L];
      d.appendChild(b); d.appendChild(p); chars.appendChild(d);
    });

    var host = $("chapterSummaries"); host.innerHTML = "";
    summary.chapters.forEach(function(ch){
      var det = document.createElement("details");
      var s = document.createElement("summary");
      s.textContent = "Chapter " + ch.n + " · " + ch.title[L];
      var p = document.createElement("p"); p.textContent = ch[L];
      det.appendChild(s); det.appendChild(p); host.appendChild(det);
    });
  }

  function setSumLang(v){
    lang = v; setLang(v); renderSummary();
  }
  $("langEs").onclick = function(){ setSumLang("es"); };
  $("langEn").onclick = function(){ setSumLang("en"); };

  // ---- Arranque ----
  lang = getLang();
  buildChapterButtons();
  loadChapter(1);

  fetch(BASE + "summary.json")
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(data){ summary = data; renderSummary(); loadChapter(current); })
    .catch(function(){
      $("sumErr").textContent = "No se pudo cargar summary.json. Abre la página por HTTP (ver README).";
      $("sumErr").className = "note err";
    });
})();
</script>
</body>
</html>

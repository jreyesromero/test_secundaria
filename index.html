<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --paper:#EEF2F7; --grid:rgba(20,33,61,.055); --surface:#FFFFFF;
    --ink:#14213D; --ink-soft:#5A6478; --line:#D7DEE8; --line-strong:#B9C4D4;
    --brand:#1565C0; --brand-ink:#FFFFFF;
    --ok:#1F9254; --ok-bg:#E3F3E9; --ok-line:#9DD5B2;
    --bad:#D23B37; --bad-bg:#FBE6E5; --bad-line:#EBAEAC;
    --warn:#E2A008; --warn-bg:#FBF0D5;
    --shadow:0 1px 0 rgba(20,33,61,.04), 0 10px 30px -18px rgba(20,33,61,.5);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
  body{
    height:100%;margin:0;
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;
    -webkit-font-smoothing:antialiased;line-height:1.5;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0D1826; --grid:rgba(255,255,255,.05); --surface:#15233A;
      --ink:#E9F0F9; --ink-soft:#9DAFC6; --line:#283A56; --line-strong:#385072;
      --brand:#5AA0EC; --brand-ink:#08121F;
      --ok:#54C684; --ok-bg:rgba(84,198,132,.14); --ok-line:rgba(84,198,132,.4);
      --bad:#F0706B; --bad-bg:rgba(240,112,107,.14); --bad-line:rgba(240,112,107,.4);
      --warn:#F2C457; --warn-bg:rgba(242,196,87,.14);
      --shadow:0 1px 0 rgba(0,0,0,.2), 0 16px 40px -22px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0D1826; --grid:rgba(255,255,255,.05); --surface:#15233A;
    --ink:#E9F0F9; --ink-soft:#9DAFC6; --line:#283A56; --line-strong:#385072;
    --brand:#5AA0EC; --brand-ink:#08121F;
    --ok:#54C684; --ok-bg:rgba(84,198,132,.14); --ok-line:rgba(84,198,132,.4);
    --bad:#F0706B; --bad-bg:rgba(240,112,107,.14); --bad-line:rgba(240,112,107,.4);
    --warn:#F2C457; --warn-bg:rgba(242,196,87,.14);
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 16px 40px -22px rgba(0,0,0,.8);
  }

  .wrap{max-width:680px;margin:0 auto;padding:clamp(16px,4vw,40px) clamp(14px,4vw,24px);min-height:100%;display:flex;flex-direction:column;justify-content:center}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .pad{padding:clamp(20px,5vw,34px)}
  .ribbon{height:6px;display:flex}
  .ribbon i{flex:1}
  .ribbon i:nth-child(1){background:var(--bad)}
  .ribbon i:nth-child(2){background:var(--warn)}
  .ribbon i:nth-child(3){background:var(--brand)}
  .ribbon i:nth-child(4){background:var(--ok)}

  h1{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:0;font-size:clamp(28px,7vw,42px)}
  .sub{color:var(--ink-soft);margin:10px 0 0;font-size:clamp(15px,3.6vw,17px)}
  .q{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:clamp(20px,5vw,26px);line-height:1.25;letter-spacing:-.01em;margin:4px 0 0}

  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:color-mix(in srgb,var(--surface) 85%,var(--paper))}
  .counter{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-soft)}
  .counter b{color:var(--ink)}

  /* home */
  .subject{margin-top:26px}
  .subject:first-of-type{margin-top:20px}
  .subject-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .subject-ico{width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--brand) 14%,var(--surface));display:grid;place-items:center;font-size:22px;flex:none}
  .subject-name{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:19px}
  .subject-lang{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px;text-transform:uppercase}
  .unit-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .unit-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;background:var(--surface);
    border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;font-family:inherit;color:var(--ink);transition:border-color .15s,transform .05s}
  .unit-card:hover{border-color:var(--brand)}
  .unit-card:active{transform:translateY(1px)}
  .unit-card:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}
  .unit-num{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--brand-ink);background:var(--brand);min-width:34px;height:34px;padding:0 8px;border-radius:8px;display:grid;place-items:center;flex:none}
  .unit-info{flex:1;min-width:0}
  .unit-title{font-weight:600;font-size:16px}
  .unit-meta{font-size:13px;color:var(--ink-soft);margin-top:1px}
  .unit-go{color:var(--ink-soft);font-size:20px;flex:none}

  /* ruler progress */
  .ruler{height:12px;border:1px solid var(--line-strong);border-radius:999px;background:
    repeating-linear-gradient(90deg,transparent 0,transparent 24px,var(--grid) 24px,var(--grid) 25px);overflow:hidden;position:relative;margin-bottom:22px}
  .ruler>span{position:absolute;inset:0;width:0;background:var(--brand);border-radius:999px;transition:width .45s cubic-bezier(.22,.61,.36,1)}

  .opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;font-family:inherit;font-size:16px;color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;transition:border-color .15s,background .15s,transform .05s}
  .opt:hover:not(:disabled){border-color:var(--brand)}
  .opt:active:not(:disabled){transform:translateY(1px)}
  .opt:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}
  .opt:disabled{cursor:default}
  .opt .key{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-soft);margin-top:-1px}
  .opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
  .opt.correct .key{border-color:var(--ok);background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
  .opt.wrong .key{border-color:var(--bad);background:var(--bad);color:#fff}
  .opt.dim{opacity:.5}

  .feedback{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:15px;display:none}
  .feedback.show{display:block;animation:pop .28s ease}
  .feedback.good{background:var(--ok-bg);border:1px solid var(--ok-line)}
  .feedback.poor{background:var(--bad-bg);border:1px solid var(--bad-line)}
  .feedback b{font-family:"Space Grotesk",sans-serif}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .btn{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:16px;cursor:pointer;border:1.5px solid transparent;border-radius:11px;padding:13px 22px;transition:filter .15s,transform .05s,border-color .15s}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}
  .btn-primary{background:var(--brand);color:var(--brand-ink)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  .question-img{max-width:280px;max-height:280px;width:100%;height:auto;margin:1.5rem auto;display:block;border-radius:8px;border:2px solid var(--line);box-shadow:var(--shadow)}
  .question-svg{max-width:280px;height:200px;margin:1.3rem auto;display:flex;align-items:center;justify-content:center}
  .question-svg svg{width:100%;height:auto}

  .match-row{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
  .match-row:first-of-type{border-top:0}
  .match-icon{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .match-icon svg{width:100%;height:100%}
  .match-pick{display:flex;flex-direction:column;gap:6px}
  select{font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
  select:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px;border-color:var(--brand)}
  .match-row.ok select{border-color:var(--ok-line);background:var(--ok-bg)}
  .match-row.no select{border-color:var(--bad-line);background:var(--bad-bg)}
  .solved{font-size:12.5px;color:var(--bad);font-family:"IBM Plex Mono",monospace;display:none}
  .match-row.no .solved{display:block}

  .score-big{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(46px,14vw,74px);line-height:1;letter-spacing:-.02em}
  .score-big small{font-size:.4em;color:var(--ink-soft)}
  .badge{display:inline-block;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;margin-top:6px}
  .breakdown{display:flex;gap:10px;margin:22px 0 4px;flex-wrap:wrap}
  .stat{flex:1;min-width:130px;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600}
  .stat .l{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .best{margin-top:16px;font-size:13.5px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace}
  .note{margin-top:14px;font-size:14px;color:var(--ink-soft)}

  .hidden{display:none}

  .card-flip{perspective:1000px;cursor:pointer;min-height:140px;position:relative}
  .card-flip-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
  .card-flip.flipped .card-flip-inner{transform:rotateY(180deg)}
  .card-flip-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;border:2px solid var(--brand);border-radius:12px;background:var(--surface)}
  .card-flip-front{color:var(--brand);font-weight:600;font-size:16px;font-family:"Space Grotesk",sans-serif}
  .card-flip-back{transform:rotateY(180deg);background:color-mix(in srgb,var(--brand) 8%,var(--surface));color:var(--ink);font-size:14px;line-height:1.6}
  .card-flip-back p{margin:0}
  .card-hint{font-size:12px;color:var(--ink-soft);margin-top:8px;font-family:"IBM Plex Mono",monospace}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="ribbon"><i></i><i></i><i></i><i></i></div>

    <!-- HOME -->
    <section id="home" class="pad">
      <h1 id="homeTitle">Study Quizzes</h1>
      <p class="sub" id="homeSub">Pick a subject and a topic to practise.</p>
      <div id="subjectList"></div>
      <p class="note" id="homeNote"></p>
    </section>

    <!-- MENU -->
    <section id="menu" class="pad hidden">
      <div style="margin-bottom:40px">
        <h1 id="menuTitle" style="font-size:clamp(24px,6vw,36px);margin-bottom:8px"></h1>
        <p class="sub" id="menuUnit"></p>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;max-width:280px;margin:0 auto">
        <button class="btn btn-primary" id="toCardsBtn" style="font-size:16px;padding:18px 24px">
          📚 Tarjetas de estudio
        </button>
        <button class="btn btn-ghost" id="toQuizDirectBtn" style="font-size:16px;padding:18px 24px">
          ❓ Quiz
        </button>
      </div>
    </section>

    <!-- STUDY CARDS -->
    <section id="cards" class="pad hidden">
      <div style="margin-bottom:24px">
        <h1 id="cardsTitle" style="font-size:clamp(22px,5.5vw,30px)">Conceptos clave</h1>
        <p class="sub" id="cardsUnit"></p>
      </div>
      <div id="cardsContainer" style="display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:24px"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="backCardsBtn">Back</button>
        <button class="btn btn-primary" id="toQuizBtn">Start quiz</button>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="quiz" class="pad hidden">
      <div class="meta">
        <span class="tag" id="topicTag">Topic</span>
        <span class="counter">Q <b id="qNow">01</b> / <span id="qTotal">20</span></span>
      </div>
      <div class="ruler"><span id="rulerFill"></span></div>
      <p class="q" id="qText"></p>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="quitBtn">Exit</button>
        <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
      </div>
    </section>

    <!-- MATCHING -->
    <section id="matching" class="pad hidden">
      <div class="meta">
        <span class="tag">Part B</span>
        <span class="counter" id="matchCounter">Matching</span>
      </div>
      <h1 id="matchTitle" style="font-size:clamp(22px,5.5vw,30px)">Matching</h1>
      <p class="sub" id="matchPrompt"></p>
      <div id="matchRows" style="margin-top:14px"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="finishBtn">Check &amp; finish</button>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="results" class="pad hidden">
      <div class="meta"><span class="tag" id="resTag">Results</span><span class="counter" id="resDate"></span></div>
      <div class="score-big" id="scoreBig">0<small>/0</small></div>
      <div><span class="badge" id="badge"></span></div>
      <p class="sub" id="resMsg"></p>
      <div class="breakdown">
        <div class="stat"><div class="n" id="mcqStat">0/0</div><div class="l">Multiple choice</div></div>
        <div class="stat" id="matchStatWrap"><div class="n" id="matchStat">0/0</div><div class="l">Matching</div></div>
      </div>
      <p class="best" id="bestEnd"></p>
      <div class="btn-row" style="justify-content:flex-start">
        <button class="btn btn-primary" id="againBtn">Play again</button>
        <button class="btn btn-ghost" id="homeBtn">Back to subjects</button>
      </div>
    </section>
  </div>
</main>

<script>
(function(){
  "use strict";
  var BOOT = window.__BOOTSTRAP__ || null;

  var $=function(id){return document.getElementById(id);};
  function show(id){["home","menu","cards","quiz","matching","results"].forEach(function(s){$(s).classList.toggle("hidden",s!==id);});
    window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});}
  function pad(n){return (n<10?"0":"")+n;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  function loadRegistry(){return BOOT?Promise.resolve(BOOT.registry):fetch("data/subjects.json").then(function(r){return r.json();});}
  function loadUnit(file){return BOOT?Promise.resolve(BOOT.units[file]):fetch(file).then(function(r){return r.json();});}

  // ---- State ----
  var CUR=null, TYPES=[], deck=[], idx=0, mcqScore=0, matchScore=0, answered=false, locked=false;
  var MCQ_COUNT=0, MATCH_COUNT=0, TOTAL=0;
  var KEYS=["a","b","c","d","e","f"];

  // ---- Best score (per subject+unit) ----
  function bestKey(){return "sq_best_"+(CUR?CUR.subjectId+"_"+CUR.unitId:"x");}
  function getBest(){try{var v=localStorage.getItem(bestKey());return v?parseInt(v,10):null;}catch(e){return null;}}
  function setBest(v){try{localStorage.setItem(bestKey(),String(v));}catch(e){}}

  // ---- HOME ----
  function renderHome(reg){
    $("homeTitle").textContent=reg.title||"Study Quizzes";
    $("homeSub").textContent=reg.subtitle||"";
    var host=$("subjectList"); host.innerHTML="";
    (reg.subjects||[]).forEach(function(sub){
      var block=document.createElement("div"); block.className="subject";
      var head='<div class="subject-head"><div class="subject-ico">'+(sub.icon||"📘")+'</div>'+
               '<div class="subject-name">'+esc(sub.name)+'</div>'+
               (sub.lang?'<div class="subject-lang">'+esc(sub.lang)+'</div>':'')+'</div>';
      var grid=document.createElement("div"); grid.className="unit-grid";
      (sub.units||[]).forEach(function(u){
        var card=document.createElement("button"); card.className="unit-card"; card.type="button";
        card.innerHTML='<span class="unit-num">'+esc(u.unit||u.id)+'</span>'+
          '<span class="unit-info"><span class="unit-title">'+esc(u.title)+'</span>'+
          '<span class="unit-meta">'+(u.count?u.count+" questions":"")+'</span></span>'+
          '<span class="unit-go">›</span>';
        card.addEventListener("click",function(){openUnit(u.file);});
        grid.appendChild(card);
      });
      block.innerHTML=head; block.appendChild(grid); host.appendChild(block);
    });
  }

  function openUnit(file){
    loadUnit(file).then(startQuiz).catch(function(){
      $("homeNote").textContent="Could not load this topic. If you opened the file directly, run it from GitHub Pages or a local server.";
    });
  }

  // ---- Build deck ----
  function buildDeck(){
    deck = shuffle(CUR.questions).map(function(item){
      var opts = item.o.map(function(text,i){return {text:text, correct:i===item.a};});
      return {t:item.t, q:item.q, e:item.e, img:item.img, svg:item.svg, opts:shuffle(opts)};
    });
  }

  function startQuiz(unit){
    CUR=unit;
    TYPES=(unit.matching&&unit.matching.types)?unit.matching.types:[];
    MCQ_COUNT=unit.questions.length; MATCH_COUNT=TYPES.length; TOTAL=MCQ_COUNT+MATCH_COUNT;
    idx=0; mcqScore=0; matchScore=0;
    $("qTotal").textContent=MCQ_COUNT;
    buildDeck();
    renderMenu(); show("menu");
  }

  function renderMenu(){
    $("menuTitle").textContent=CUR.title||CUR.subject;
    $("menuUnit").textContent=(CUR.unit?CUR.unit+": ":"")+CUR.subject;
  }

  function renderCards(){
    $("cardsTitle").textContent=CUR.title||CUR.subject;
    $("cardsUnit").textContent=(CUR.unit?CUR.unit+": ":"")+CUR.subject;
    var cont=$("cardsContainer"); cont.innerHTML="";
    if(!CUR.cards||!CUR.cards.length){
      cont.innerHTML='<p style="text-align:center;color:var(--ink-soft)">Sin tarjetas disponibles</p>';
      return;
    }
    CUR.cards.forEach(function(cat){
      var catDiv=document.createElement("div");
      catDiv.style.marginBottom="28px";
      var headerDiv=document.createElement("div");
      headerDiv.style.display="flex";
      headerDiv.style.justifyContent="space-between";
      headerDiv.style.alignItems="center";
      headerDiv.style.marginBottom="12px";
      var title=document.createElement("h3");
      title.textContent=cat.category||"";
      title.style.fontSize="clamp(16px,4vw,18px)";
      title.style.fontWeight="600";
      title.style.margin="0";
      title.style.color="var(--brand)";
      headerDiv.appendChild(title);
      if(cat.exercises_search){
        var exBtn=document.createElement("a");
        exBtn.textContent="📝 Ejercicios";
        exBtn.href="https://www.liveworksheets.com/search.asp?content="+encodeURIComponent(cat.exercises_search);
        exBtn.target="_blank";
        exBtn.rel="noopener noreferrer";
        exBtn.style.fontSize="13px";
        exBtn.style.padding="6px 12px";
        exBtn.style.background="var(--brand)";
        exBtn.style.color="var(--brand-ink)";
        exBtn.style.textDecoration="none";
        exBtn.style.borderRadius="8px";
        exBtn.style.fontWeight="600";
        exBtn.style.transition="filter .15s";
        exBtn.addEventListener("mouseover",function(){exBtn.style.filter="brightness(1.06)";});
        exBtn.addEventListener("mouseout",function(){exBtn.style.filter="brightness(1)";});
        headerDiv.appendChild(exBtn);
      }
      catDiv.appendChild(headerDiv);
      var grid=document.createElement("div");
      grid.style.display="grid";
      grid.style.gridTemplateColumns="repeat(auto-fit,minmax(160px,1fr))";
      grid.style.gap="12px";
      (cat.terms||[]).forEach(function(term){
        var card=document.createElement("div");
        card.className="card-flip";
        card.innerHTML='<div class="card-flip-inner"><div class="card-flip-face card-flip-front">'+esc(term.title)+'<div class="card-hint">Haz click</div></div>'+
          '<div class="card-flip-face card-flip-back"><p>'+esc(term.definition)+'</p></div></div>';
        card.addEventListener("click",function(){card.classList.toggle("flipped");});
        grid.appendChild(card);
      });
      catDiv.appendChild(grid);
      cont.appendChild(catDiv);
    });
  }

  function showCards(){
    renderCards(); show("cards");
  }

  function showQuizDirect(){
    renderQ(); show("quiz");
  }

  function renderQ(){
    var item=deck[idx];
    answered=false; locked=false;
    $("topicTag").textContent=item.t||CUR.subject;
    $("qNow").textContent=pad(idx+1);
    $("qText").textContent=item.q;
    if(item.img){
      var im=document.createElement("img"); im.src=item.img; im.alt=""; im.className="question-img"; $("qText").appendChild(im);
    } else if(item.svg){
      var sv=document.createElement("div"); sv.className="question-svg"; sv.innerHTML=item.svg; $("qText").appendChild(sv);
    }
    $("rulerFill").style.width=((idx)/deck.length*100)+"%";
    $("feedback").className="feedback";
    var next=$("nextBtn"); next.disabled=true; next.textContent=(idx===deck.length-1)?(TYPES.length?"Go to signs":"See score"):"Next";
    var box=$("opts"); box.innerHTML="";
    item.opts.forEach(function(opt,i){
      var b=document.createElement("button"); b.className="opt"; b.type="button";
      b.innerHTML='<span class="key">'+KEYS[i]+'</span><span>'+esc(opt.text)+'</span>';
      b.addEventListener("click",function(){choose(i);});
      box.appendChild(b);
    });
  }

  function choose(i){
    if(locked) return;
    locked=true; answered=true;
    var item=deck[idx], buttons=$("opts").querySelectorAll(".opt"), correctIndex=-1;
    item.opts.forEach(function(o,k){if(o.correct)correctIndex=k;});
    var isRight=item.opts[i].correct;
    if(isRight) mcqScore++;
    buttons.forEach(function(btn,k){btn.disabled=true;
      if(k===correctIndex) btn.classList.add("correct");
      else if(k===i) btn.classList.add("wrong");
      else btn.classList.add("dim");});
    var fb=$("feedback"); fb.className="feedback show "+(isRight?"good":"poor");
    var msgs={"es":{right:"¡Correcto! ",wrong:"No es correcto. "},"en":{right:"Correct! ",wrong:"Not quite. "}};
    var lang=CUR.lang||"en", msg=msgs[lang]||msgs["en"];
    fb.innerHTML='<b>'+(isRight?msg.right:msg.wrong)+'</b>'+esc(item.e||"");
    $("nextBtn").disabled=false; $("nextBtn").focus();
  }

  function next(){
    if(!answered) return;
    if(idx<deck.length-1){ idx++; renderQ(); }
    else { $("rulerFill").style.width="100%"; if(TYPES.length){ renderMatching(); show("matching"); } else toResults(); }
  }

  // ---- Matching ----
  function renderMatching(){
    var m=CUR.matching||{};
    $("matchTitle").textContent=m.title||"Matching";
    $("matchPrompt").textContent=m.prompt||"";
    $("matchCounter").textContent="Matching · "+TYPES.length+" points";
    var wrap=$("matchRows"); wrap.innerHTML="";
    var optionsHtml='<option value="">— choose —</option>'+shuffle(TYPES).map(function(ty){
      return '<option value="'+ty.id+'">'+esc(ty.label)+'</option>';}).join("");
    TYPES.forEach(function(ty){
      var row=document.createElement("div"); row.className="match-row"; row.dataset.type=ty.id;
      row.innerHTML='<div class="match-icon">'+(ty.svg||"")+'</div>'+
        '<div class="match-pick"><select aria-label="sign">'+optionsHtml+'</select><span class="solved"></span></div>';
      wrap.appendChild(row);
    });
    $("finishBtn").textContent="Check & finish"; $("finishBtn").dataset.stage="check";
  }

  function finishMatching(){
    var rows=$("matchRows").querySelectorAll(".match-row");
    if($("finishBtn").dataset.stage==="check"){
      matchScore=0;
      rows.forEach(function(row){
        var sel=row.querySelector("select"), typeId=parseInt(row.dataset.type,10);
        var chosen=sel.value?parseInt(sel.value,10):null, right=chosen===typeId;
        row.classList.remove("ok","no"); row.classList.add(right?"ok":"no"); sel.disabled=true;
        if(!right){var c=TYPES.filter(function(t){return t.id===typeId;})[0];
          row.querySelector(".solved").textContent="Correct: "+(c?c.label:"");}
        if(right) matchScore++;
      });
      $("finishBtn").textContent="See my score"; $("finishBtn").dataset.stage="results";
    } else { toResults(); }
  }

  // ---- Results ----
  function toResults(){
    var total=mcqScore+matchScore;
    $("resTag").textContent=CUR.subject+" · "+(CUR.unit||"");
    $("scoreBig").innerHTML=total+'<small>/'+TOTAL+'</small>';
    $("mcqStat").textContent=mcqScore+"/"+MCQ_COUNT;
    $("matchStatWrap").style.display=TYPES.length?"":"none";
    $("matchStat").textContent=matchScore+"/"+MATCH_COUNT;
    $("resDate").textContent=new Date().toLocaleDateString();
    var badge=$("badge"), label,bg,fg,text;
    var exc=Math.ceil(TOTAL*0.9), good=Math.ceil(TOTAL*0.75), pass=Math.ceil(TOTAL*0.5);
    if(total>=exc){label="Excellent";bg="var(--ok-bg)";fg="var(--ok)";text="Outstanding — you really know this topic. 🎉";}
    else if(total>=good){label="Very good";bg="var(--brand)";fg="var(--brand-ink)";text="Great work. Review the few you missed and you’re ready.";}
    else if(total>=pass){label="Pass";bg="var(--warn-bg)";fg="var(--warn)";text="Good effort — go over the tricky parts once more.";}
    else {label="Keep practising";bg="var(--bad-bg)";fg="var(--bad)";text="Not there yet. Review the topic and try again — you’ve got this.";}
    badge.textContent=label; badge.style.background=bg; badge.style.color=fg; $("resMsg").textContent=text;
    var prev=getBest();
    if(prev==null||total>prev){setBest(total);$("bestEnd").textContent="New best score on this device! ("+total+"/"+TOTAL+")";}
    else {$("bestEnd").textContent="Best score on this device: "+prev+"/"+TOTAL;}
    show("results");
  }

  // ---- Wire up ----
  $("nextBtn").addEventListener("click",next);
  $("finishBtn").addEventListener("click",finishMatching);
  $("againBtn").addEventListener("click",function(){startQuiz(CUR);});
  $("quitBtn").addEventListener("click",function(){show("home");});
  $("homeBtn").addEventListener("click",function(){show("home");});
  $("toCardsBtn").addEventListener("click",showCards);
  $("toQuizDirectBtn").addEventListener("click",showQuizDirect);
  $("backCardsBtn").addEventListener("click",function(){renderMenu(); show("menu");});
  $("toQuizBtn").addEventListener("click",function(){renderQ(); show("quiz");});
  document.addEventListener("keydown",function(ev){
    if(!$("quiz").classList.contains("hidden")){
      if(ev.key>="1"&&ev.key<="4"&&!locked){var b=$("opts").querySelectorAll(".opt")[parseInt(ev.key,10)-1]; if(b) b.click();}
      else if(ev.key==="Enter"&&answered){ next(); }
    }
  });

  // ---- Boot ----
  loadRegistry().then(renderHome).catch(function(){
    $("homeNote").textContent="Could not load the subject list. Run this site from GitHub Pages or a local server (not by double-clicking the file).";
  });
})();
</script>
</body>
</html>
